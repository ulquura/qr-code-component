<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet" type="text/css" />
  
  <title>QR code component</title>
</head>
<body>
  <div class="container">
      <img src="./images/image-qr-code.png" alt="qr-code-image">
    <section class="theQrcodeDescription"> 
      <h1>Improve your front-end<br> skills by building projects</h1>
      <p>Scan the QR code to visit Frontend <br> Mentor and take your coding skills <br>to the next level</p>
    </section>
    <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.<br> 
    Coded by <a href="#">Benito S.Webcrawler</a>.
    </footer>
  </div>  
</body>
</html>
